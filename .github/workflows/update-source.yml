name: Update source

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 min (mínimo GitHub): revisa releases y actualiza apps.json
  workflow_dispatch:          # botón "Run workflow" manual
  repository_dispatch:        # trigger instantáneo desde el repo de una app
    types: [update-source]
  push:
    paths:
      - "sources.json"
      - "scripts/build-source.mjs"

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build apps.json
        env:
          # GITHUB_TOKEN basta para repos de apps PÚBLICOS.
          # Si algún repo de app es PRIVADO, crea un PAT (repo scope) y
          # guárdalo como secret SOURCE_TOKEN en este repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: node scripts/build-source.mjs
      - name: Commit si cambió
        run: |
          if ! git diff --quiet apps.json; then
            git config user.name "zorn-bot"
            git config user.email "bot@zorn.app"
            git add apps.json
            git commit -m "chore: auto-update source desde releases"
            git push
          else
            echo "Sin cambios en apps.json"
          fi
